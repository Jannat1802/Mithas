<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Mithas · Storefront</title>
  <!-- Poppins & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- CSS variables ----- */
    :root {
      --primary: #c44536;
      --primary-light: #e05a4f;
      --secondary: #2d2d2d;
      --bg: #f9f7f5;
      --card-bg: #ffffff;
      --text: #1e1e1e;
      --text-light: #6b6b6b;
      --border: #e0dbd7;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      --radius: 16px;
      --radius-sm: 12px;
      --header-height: 64px;
      --nav-height: 68px;
      --transition: all 0.2s ease;
      --green: #2e7d32;
      --gray: #9e9e9e;
      --red: #c62828;
      --orange: #ed6c02;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: var(--header-height);
      padding-bottom: calc(var(--nav-height) + 8px);
      -webkit-tap-highlight-color: transparent;
      line-height: 1.4;
    }

    /* ----- Fixed header ----- */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
      color: var(--primary);
    }
    .logo span { color: var(--secondary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-icon, .auth-indicator {
      font-size: 1.2rem;
      color: var(--secondary);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: var(--transition);
    }
    .search-icon:hover { background: #f0edea; }

    .auth-indicator .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gray);
      transition: var(--transition);
    }
    .auth-indicator .dot.logged-in { background: var(--green); }
    .auth-indicator .dot.guest { background: #b0b0b0; }

    /* ----- Bottom navigation ----- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.04);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.7rem;
      color: var(--text-light);
      text-decoration: none;
      transition: var(--transition);
      position: relative;
      flex: 1;
      height: 100%;
      padding: 6px 0;
    }
    .nav-item i { font-size: 1.3rem; }
    .nav-item.active { color: var(--primary); font-weight: 500; }
    .nav-item .badge {
      position: absolute;
      top: 4px;
      right: calc(50% - 20px);
      background: var(--primary);
      color: white;
      font-size: 0.65rem;
      font-weight: 600;
      min-width: 18px;
      height: 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      box-shadow: 0 2px 6px rgba(196, 69, 54, 0.3);
    }

    /* ----- Main & sections ----- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .section {
      display: none;
      animation: fade 0.25s ease;
    }
    .section.active { display: block; }

    @keyframes fade {
      from { opacity: 0.4; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero slider */
    .hero {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 24px;
      aspect-ratio: 16 / 9;
      background: #e8e3df;
      box-shadow: var(--shadow);
    }
    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      background-size: cover;
      background-position: center;
    }
    .hero-slide.active { opacity: 1; }
    .hero-slide .fallback-text {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
      background: #f3efec;
      letter-spacing: 1px;
    }
    .hero-controls {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      z-index: 5;
    }
    .hero-controls button {
      background: rgba(255, 255, 255, 0.7);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      backdrop-filter: blur(4px);
      font-size: 1rem;
      color: var(--secondary);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }
    .hero-controls button:active { transform: scale(0.94); }

    .indicators {
      position: absolute;
      bottom: 16px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }
    .indicators span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transition: var(--transition);
    }
    .indicators span.active { background: white; width: 20px; border-radius: 10px; }

    /* Category bubbles */
    .categories-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .categories-scroll::-webkit-scrollbar { display: none; }

    .cat-bubble {
      flex: 0 0 auto;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      background: #ddd;
      color: #222;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }
    .cat-bubble.active {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      font-weight: 600;
    }

    /* Product grid — two columns on mobile */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
    }
    .product-card:active { transform: scale(0.98); }

    .product-img {
      aspect-ratio: 1 / 1;
      background: #f3efec;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 12px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .product-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-cat {
      font-size: 0.7rem;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .product-price {
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
      margin-top: 2px;
    }
    .product-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      gap: 6px;
    }
    .btn-icon {
      background: #f0edea;
      border: none;
      border-radius: 30px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: var(--secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-icon.wishlisted { color: var(--primary); }
    .btn-icon:active { transform: scale(0.9); }

    .btn-add-cart {
      background: var(--primary);
      border: none;
      border-radius: 30px;
      padding: 8px 12px;
      color: white;
      font-weight: 500;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      flex: 1;
      transition: var(--transition);
    }
    .btn-add-cart:active { background: #b03a2e; }

    /* Generic buttons */
    .btn {
      padding: 12px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      border: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { opacity: 0.85; transform: scale(0.97); }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }
    .btn-outline:active { background: #fef2f0; }
    .btn-secondary { background: var(--secondary); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      max-width: 440px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px 20px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
      transform: translateY(10px);
      transition: transform 0.2s ease;
      position: relative;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      color: var(--text-light);
      cursor: pointer;
    }

    /* Forms */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--text-light);
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      background: #faf9f8;
      transition: var(--transition);
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 8px;
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-light);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: var(--transition);
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Cart & wishlist items */
    .list-item {
      display: flex;
      gap: 12px;
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      align-items: center;
    }
    .list-item-img {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: #f0edea;
      overflow: hidden;
      flex-shrink: 0;
    }
    .list-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .list-item-info { flex: 1; }
    .list-item-name { font-weight: 600; font-size: 0.9rem; }
    .list-item-price { font-weight: 600; color: var(--primary); }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }
    .qty-btn {
      background: #f0edea;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .remove-btn {
      background: none;
      border: none;
      color: var(--red);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px;
    }

    /* Status colors */
    .status-Pending { color: var(--orange); }
    .status-Confirmed { color: #1976d2; }
    .status-Preparing { color: #9c27b0; }
    .status-Shipped { color: #0288d1; }
    .status-Delivered { color: var(--green); }
    .status-Cancelled { color: var(--red); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-light);
    }
    .empty i { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--secondary);
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 0.85rem;
      z-index: 500;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .toast.show { opacity: 1; }

    /* Menu overlay */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 400;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
    }
    .menu-overlay.open { transform: translateX(0); }
    .menu-overlay a {
      text-decoration: none;
      color: var(--text);
      font-size: 1.1rem;
      padding: 14px 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .menu-overlay a i { width: 24px; color: var(--primary); }

    /* Product detail modal */
    .detail-img {
      width: 100%;
      aspect-ratio: 1/1;
      background: #f0edea;
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .detail-img img { width: 100%; height: 100%; object-fit: cover; }

    /* about contact */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    /* desktop adjustments */
    @media (min-width: 640px) {
      .product-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .container { padding: 24px; }
    }
    @media (min-width: 900px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); }
      .bottom-nav { display: none; }
      body { padding-bottom: 16px; }
      .menu-overlay { width: 360px; left: auto; right: 0; }
    }

    /* loading spinner */
    .spinner {
      border: 3px solid #f0edea;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="logo">Mithas<span>Hotel</span></div>
    <div class="header-actions">
      <a href="#search" class="search-icon"><i class="fas fa-search"></i></a>
      <button class="auth-indicator" id="authIndicator" aria-label="Authentication status">
        <span class="dot guest" id="authDot"></span>
      </button>
    </div>
  </header>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="#home" class="nav-item active" data-nav="home"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="#wishlist" class="nav-item" data-nav="wishlist"><i class="fas fa-heart"></i><span>Wishlist</span><span class="badge" id="wishBadge">0</span></a>
    <a href="#cart" class="nav-item" data-nav="cart"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="badge" id="cartBadge">0</span></a>
    <a href="#menu" class="nav-item" data-nav="menu"><i class="fas fa-bars"></i><span>Menu</span></a>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="container" id="app">
    <!-- HOME -->
    <section id="home" class="section active">
      <div class="hero" id="heroSlider">
        <!-- slides injected -->
        <div class="hero-controls">
          <button id="prevSlide"><i class="fas fa-chevron-left"></i></button>
          <button id="nextSlide"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="indicators" id="heroIndicators"></div>
      </div>
      <div class="categories-scroll" id="categoriesScroll"></div>
      <div class="product-grid" id="productGrid"></div>
    </section>

    <!-- SEARCH -->
    <section id="search" class="section">
      <h2 style="margin-bottom:16px;">Search</h2>
      <input type="search" id="searchInput" placeholder="Search products..." style="width:100%;padding:14px;border-radius:40px;border:1px solid var(--border);margin-bottom:20px;">
      <div class="product-grid" id="searchResults"></div>
      <div class="empty hidden" id="searchEmpty"><i class="fas fa-search"></i><p>No products found</p></div>
    </section>

    <!-- CART -->
    <section id="cart" class="section">
      <h2 style="margin-bottom:16px;">Your Cart</h2>
      <div id="cartContainer"></div>
      <div id="cartFooter" class="hidden" style="margin-top:20px;background:white;padding:18px;border-radius:var(--radius);box-shadow:var(--shadow);">
        <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem;margin-bottom:14px;">
          <span>Total</span><span id="cartTotal">₹0</span>
        </div>
        <button class="btn" style="width:100%;" id="checkoutBtn"><i class="fas fa-credit-card"></i> Proceed to Checkout</button>
      </div>
    </section>

    <!-- WISHLIST -->
    <section id="wishlist" class="section">
      <h2 style="margin-bottom:16px;">Wishlist</h2>
      <div id="wishlistContainer"></div>
    </section>

    <!-- ORDERS -->
    <section id="orders" class="section">
      <h2 style="margin-bottom:16px;">My Orders</h2>
      <div id="ordersContainer"></div>
    </section>

    <!-- PROFILE -->
    <section id="profile" class="section">
      <h2 style="margin-bottom:16px;">Profile</h2>
      <div class="card" id="profileCard"></div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section">
      <div class="card">
        <h2>About Mithas</h2>
        <p style="margin-top:12px;color:var(--text-light);">Mithas is a modern hospital
